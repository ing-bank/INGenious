# Settings for the IDE UI tests (mvn -Puitest -pl IDE-UITest -am verify ...).
#
# Every key can be overridden on the command line with -D<key>=<value>, which always wins over this file.
# Another file can be used instead of this one: -Duitest.config=/path/to/my-uitest.properties
# ${uitest.moduleDir} is the IDE-UITest folder; ${java.home} is the JDK that runs Maven.
# See README section 2 for every setting.

# ---- Test JVM and input ------------------------------------------------------------------------
# JVM that runs the IDE under test. AssertJ Swing needs JDK 17-25 (JDK 26 removed java.applet).
# Set it when Maven itself runs on a newer JDK, e.g.
#   /Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home/bin/java
uitest.jvm=${java.home}/bin/java
# direct (silent, never touches your mouse/keyboard) or robot (real OS mouse/keyboard)
uitest.input=direct

# ---- Test selection (RTM codes, comma-separated, * and ? wildcards; empty = everything) -----------
uitest.tests=
uitest.scenarios=
# Suite name from src/test/resources/suites/<name>.txt, e.g. smoke or regression
uitest.suite=
uitest.exclude=
# true = only list what would run
uitest.list=false

# ---- Evidence and reports ------------------------------------------------------------------------
# screenshot, recording (MP4) or both
uitest.evidence=screenshot
# Comma-separated: html, rtm
uitest.report=html
# Run folders <outputDir>/<run id>/ (git-ignored)
uitest.outputDir=${uitest.moduleDir}/../ui-test-output

# ---- RTM publishing (uitest.report=rtm) ----------------------------------------------------------
# RTM repository root: its scripts and scenarios/ are used from here
uitest.rtm.dir=${uitest.moduleDir}/../../p33148-ingenious-requirement-traceability-matrix
# Cycle folder, as an absolute path. Evidence goes to <cycleDir>/<role>/, results to <cycleDir>/results.yaml.
# The RTM evidence report only lists cycles under <rtm.dir>/cycles/.
#   e.g. /Users/me/codebases/p33148-ingenious-requirement-traceability-matrix/cycles/Sprint 12
uitest.rtm.cycleDir=
# Shortcut when cycleDir is empty: the cycle name, i.e. <rtm.dir>/cycles/<cycle>
uitest.rtm.cycle=
# dev-test or qa: which evidence subfolder and result columns are filled
uitest.rtm.role=dev-test
uitest.rtm.tester=INGenious UI Test (automated)
# Python 3 with PyYAML
uitest.rtm.python=python3
# Regenerate the RTM evidence report after publishing
uitest.rtm.generateReport=true
