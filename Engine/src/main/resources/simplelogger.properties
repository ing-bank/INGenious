# Config for the slf4j-simple provider bundled with the app.
#
# The desktop IDE's live execution console (ConsoleWebView) captures every
# line printed to System.out/System.err and colors it by a leading [TAG]
# (see ConsoleWebView.classify/bucketFor - [WARNING] -> amber, [FAIL]/[ERROR]
# -> red, etc). slf4j-simple's own default format leads with a [threadName]
# instead of the level, which that classifier misreads as an unrelated tag.
# Putting the level in brackets and dropping the thread name makes SLF4J
# output participate in the same tag convention instead of being
# misclassified.
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
