schemaVersion: 1
testCase: SelectToken
scenario: GetEnv
steps:
  - step: 1
    object: General
    description: "print the data [<Data>]"
    action: AddVar
    input: "%regionName%"
    condition: "%envName%"

  - step: 2
    object: General
    description: To get URL
    action: AddVar
    input: TokenGeneration:URL
    condition: "%Url%"

  - step: 3
    object: String Operations
    description: Add a variable to access within testcase
    action: Replace
    input: '%Url%,"<regionName>",%envName%,"all"'
    condition: "%finalURL%"

  - step: 4
    object: General
    description: Add a Global variable to access across test set
    action: AddGlobalVar
    input: "%finalURL%"
    condition: "%applicationURL%"

  - step: 5
    object: General
    description: store in Global Datasheet
    action: storeVariableInDataSheet
    input: TokenGeneration:FinalURL
    condition: "%finalURL%"

  - step: 6
    object: General
    description: "print the data [<Data>]"
    action: print
    input: "%applicationURL%"
