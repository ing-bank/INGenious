# Archetype-specific action packages - BROWSER (RELEASE_STRATEGY.md 9.4)
#
# Ships inside the INGenious-<version>-browser.zip. Only the action packages
# relevant to the Browser archetype are scanned, keeping startup fast and the
# action catalog focused. Copy this file to Configuration/package.properties
# when assembling the browser distribution.
#
# Core packages (general, file, stringOperations, structuredData, syntheticData)
# are always included. 'browser' carries the base Command class and web actions.

actions=com.ing.engine.commands.general,com.ing.engine.commands.file,com.ing.engine.commands.stringOperations,com.ing.engine.commands.structuredData,com.ing.engine.commands.syntheticData,com.ing.engine.commands.browser,com.ing.engine.commands.aXe,com.ing.engine.commands.galenCommands

#The Package in which TestData Logic is mentioned. Don't change if you are not sure what this is
dataprovider=com.ing.testdata.csv
