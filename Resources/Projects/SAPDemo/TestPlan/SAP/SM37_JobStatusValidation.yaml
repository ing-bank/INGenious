schemaVersion: 1
testCase: SM37_JobStatusValidation
scenario: SAP
tags:
  - '@sap'
  - '@job-monitoring'
steps:
  - step: 1
    object: SAP
    description: Open the DEMO SAP connection
    action: sapInitConnection
    input: "#DEMO"

  - step: 2
    object: SAP_SYSTEM
    description: Execute Transaction SM37 (Job Overview)
    action: sapExecuteTransaction
    input: SM37

  - step: 3
    object: ctxtJobName
    description: "Set [<Object>] to the nightly batch job name pattern"
    action: sapFill
    input: '@BATCH_DAILY_CLOSE*'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 4
    object: chkFinished
    description: "Check [<Object>] to include finished jobs in the result list"
    action: sapSelectCheckBox
    input: '@true'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 5
    object: chkCanceled
    description: "Check [<Object>] to also surface canceled/failed jobs"
    action: sapSelectCheckBox
    input: '@true'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 6
    object: btnExecute
    description: "Click [<Object>] to run the job selection (F8)"
    action: sapClick
    reference: "[Project] SM37_JobStatusValidation"

  - step: 7
    object: sbar
    description: "Assert that the selection ran without a system error"
    action: sapAssertStatusBarType
    input: '@S'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 8
    object: jobOverviewGrid
    description: "Assert that at least one job was returned"
    action: sapAssertGridRowCount
    input: '@>=1'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 9
    object: jobOverviewGrid
    description: "Find the job by name and read its Status column into a variable"
    action: sapStoreGridValueByMatchInVariable
    input: '@JobName,BATCH_DAILY_CLOSE,Status'
    condition: '%jobStatus%'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 10
    object: General
    description: "Assert the job finished successfully"
    action: assertVariable
    input: '%jobStatus%=Finished'

  - step: 11
    object: jobOverviewGrid
    description: "Find the same job and read its Duration column into a variable"
    action: sapStoreGridValueByMatchInVariable
    input: '@JobName,BATCH_DAILY_CLOSE,Duration'
    condition: '%jobDuration%'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 12
    object: General
    description: "Assert the job completed within the 30 minute SLA"
    action: assertNumericValue
    input: '@<=1800'
    condition: '%jobDuration%'

  - step: 13
    object: jobOverviewGrid
    description: "Archive the job's status into the results datasheet for audit"
    action: sapStoreGridValueByMatchInDataSheet
    input: '@JobName,BATCH_DAILY_CLOSE,Status,JobResults:Status'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 14
    object: jobOverviewGrid
    description: "Capture the status of any other BATCH_ job for the audit report, regardless of the exact name"
    action: sapStoreGridValueByMatchInDataSheetContains
    input: '@JobName,BATCH_,Status,JobResults:OtherBatchJobStatus'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 15
    object: jobOverviewGrid
    description: "Select the job row's checkbox to mark it for follow-up"
    action: sapSetCheckBoxInMatchingRow
    input: '@JobName,BATCH_DAILY_CLOSE,Select'
    condition: '@true'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 16
    object: jobOverviewGrid
    description: "Select the job's row directly (no column read needed for the next context action)"
    action: sapSelectGridRowByText
    input: '@JobName,BATCH_DAILY_CLOSE'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 17
    object: jobOverviewGrid
    description: "Re-select the first job whose name contains BATCH_ (suffix/timestamp unknown)"
    action: sapSelectGridRowByTextContains
    input: '@JobName,BATCH_'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 18
    object: jobOverviewGrid
    description: "Read row 0's Status directly now that it holds the just-selected job"
    action: sapStoreGridValueByIndexInVariable
    input: '@0,Status'
    condition: '%firstRowStatus%'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 19
    object: jobOverviewGrid
    description: "Archive which job name ended up in row 0"
    action: sapStoreGridValueByIndexInDataSheet
    input: '@0,JobName,JobResults:FirstRowJobName'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 20
    object: jobOverviewGrid
    description: "Read the Duration of any job whose name contains BATCH_ into a variable"
    action: sapStoreGridValueByMatchInVariableContains
    input: '@JobName,BATCH_,Duration'
    condition: '%anyBatchDuration%'
    reference: "[Project] SM37_JobStatusValidation"

  - step: 21
    object: General
    description: "Sanity-check the captured duration is a non-negative number"
    action: assertNumericValue
    input: '@>=0'
    condition: '%anyBatchDuration%'

  - step: 22
    object: SAP
    description: Close the DEMO SAP connection
    action: sapCloseConnection
    input: "#DEMO"
