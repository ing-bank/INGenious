schemaVersion: 1
testCase: SyntheticDataWriteBack
scenario: TestDataScope
tags:
  - regression

# SyntheticDataGenerator - the 375-site write-destination gap found in the same class of bug
# as WriteBack.yaml's GeneralOperations fix. Every Faker-backed generator action (numerify,
# regexify, streetAddress, ... 375 total) ended with the SAME raw
# `strObj.split(":", 2)[0]` / `[1]` -> userData.putData(...) that WriteBack.yaml already covers
# for storeVariableInDataSheet - braced "{Sheet:Column}" and braced+tagged forms produced the
# wrong sheet name ("{DataScope", "{[Project] DataScope", ...) and silently missed the write
# (TestDataNotFoundException / DEBUG log), and a colon-less input threw an uncaught
# ArrayIndexOutOfBoundsException on some sites.
#
# numerify("###") / regexify("[A-Z]{5}") always produce a fixed-LENGTH result even though the
# digits/letters themselves are random, so the write can be self-checked deterministically via
# String Operations.GetLength (already-correct read path) without needing to predict Faker's
# output - a regression in the write-path parsing sends the value to the wrong cell, so the
# correct cell stays empty and GetLength throws / returns the wrong length instead of the
# expected fixed length.
steps:

  # bare, untagged (canonical - worked before and after the fix)
  - step: 1
    object: Synthetic Data
    action: numerify
    input: 'DataScope:GenBare'
    condition: '###'
  - step: 2
    object: String Operations
    action: GetLength
    input: '{DataScope:GenBare}'
    condition: '%len_bare%'
  - step: 3
    object: General
    action: assertVariable
    input: '%len_bare%=3'

  # braced, untagged - pre-fix this parsed as sheet "{DataScope" and the real GenBraced cell
  # was never written, so GetLength on {DataScope:GenBraced} would throw / read stale data.
  - step: 4
    object: Synthetic Data
    action: numerify
    input: '{DataScope:GenBraced}'
    condition: '###'
  - step: 5
    object: String Operations
    action: GetLength
    input: '{DataScope:GenBraced}'
    condition: '%len_braced%'
  - step: 6
    object: General
    action: assertVariable
    input: '%len_braced%=3'

  # braced, [Project]-tagged - pre-fix this parsed as sheet "{[Project] DataScope".
  - step: 7
    object: Synthetic Data
    action: regexify
    input: '{[Project] DataScope:GenProjectTagged}'
    condition: '[A-Z]{5}'
  - step: 8
    object: String Operations
    action: GetLength
    input: '{[Project] DataScope:GenProjectTagged}'
    condition: '%len_proj%'
  - step: 9
    object: General
    action: assertVariable
    input: '%len_proj%=5'

  # braced, [Shared]-tagged - routes to the app-root Shared store; same pre-fix breakage.
  - step: 10
    object: Synthetic Data
    action: regexify
    input: '{[Shared] RegShared:GenShared}'
    condition: '[A-Z]{5}'
  - step: 11
    object: String Operations
    action: GetLength
    input: '{[Shared] RegShared:GenShared}'
    condition: '%len_shared%'
  - step: 12
    object: General
    action: assertVariable
    input: '%len_shared%=5'

# NOTE: a colon-less Input (e.g. "NoColonHere") is deliberately NOT exercised here.
# SyntheticDataGenerator's own catch(Exception) already survived that case before the fix (just
# with a worse message: "Error generating data: \nIndex 1 out of bounds..."); after the fix it
# logs a clean "Incorrect input format; expected Sheet:Column" DEBUG line instead - a message
# quality improvement, not a crash fix, for this particular file. A Status.DEBUG log counts as
# a failed step in this engine's summary, which would turn this otherwise-clean regression test
# red for a non-regression reason, so it is left untested here. Unlike SyntheticDataGenerator,
# the Basic / Webservice / StructuredData / QueueOperations sites had narrower catch blocks
# (e.g. catch (PlaywrightException e)) that did NOT catch the raw split's
# ArrayIndexOutOfBoundsException - for those the no-colon case was a genuine uncaught crash,
# fixed the same way, but they need a live browser/webservice/queue context to exercise and are
# out of scope for this headless regression project (see README).
