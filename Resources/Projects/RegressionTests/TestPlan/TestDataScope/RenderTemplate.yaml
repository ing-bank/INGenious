schemaVersion: 1
testCase: RenderTemplate
scenario: TestDataScope
tags:
  - regression
steps:

  # File Operations.populateData -> handleDataSheetVariables ->
  # TestDataToken.resolveEmbeddedTokens. This is the SAME shared resolver now used by
  # webservice payloads/endpoints/headers, RequestFulfill, DB query text, Switch context
  # values and MQ message bodies. If embedded {Sheet:Column} substitution works here it
  # works for all of them.
  #
  # Produces <working-dir>/regtest-rendered.txt. Expected content (one line):
  #   line1 PROJVAL | line2 PROJVAL | line3 SHRVAL
  # (an unresolved token is left literal, so a regression shows up as a raw {..:..} token.)

  - step: 1
    object: General
    action: AddVar
    input: '@.'
    condition: '%fileLocation%'
  - step: 2
    object: General
    action: AddVar
    input: '@regtest-rendered.txt'
    condition: '%fileName%'

  - step: 3
    object: File
    description: "Populate Data and Saving File"
    action: populateData
    input: '@line1 {DataScope:PVal} | line2 {[Project] DataScope:PVal} | line3 {[Shared] RegShared:SVal}'
