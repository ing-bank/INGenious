schemaVersion: 1
testCase: WriteBack
scenario: TestDataScope
tags:
  - regression
steps:

  # GeneralOperations.storeVariableInDataSheet - write path. The Input IS the whole
  # destination reference, so the canonical form is BARE "Sheet:Column" (steps 2-5).
  # After the sweep (Input.split(":") -> TestDataToken.parse) the braced form
  # "{...}" is also accepted (steps 6-7) - pre-sweep that made the sheet name
  # "{DataScope" and failed.
  # NOTE: rewrites the DataScope 'Scratch' cell every run to the same value (idempotent).

  - step: 1
    object: General
    action: AddVar
    input: '@written-by-regtest'
    condition: '%w%'

  # bare, untagged  (canonical)
  - step: 2
    object: General
    action: storeVariableInDataSheet
    input: 'DataScope:Scratch'
    condition: '%w%'
  - step: 3
    object: General
    action: assertVariableFromDataSheet
    input: 'DataScope:Scratch'
    condition: '%w%'

  # bare, [Project]-tagged  (canonical, explicit scope)
  - step: 4
    object: General
    action: storeVariableInDataSheet
    input: '[Project] DataScope:Scratch'
    condition: '%w%'
  - step: 5
    object: General
    action: assertVariableFromDataSheet
    input: '[Project] DataScope:Scratch'
    condition: '%w%'

  # braced, [Project]-tagged  (also accepted after the sweep)
  - step: 6
    object: General
    action: storeVariableInDataSheet
    input: '{[Project] DataScope:Scratch}'
    condition: '%w%'
  - step: 7
    object: General
    action: assertVariableFromDataSheet
    input: '{[Project] DataScope:Scratch}'
    condition: '%w%'
